services:
  - type: web
    name: joe-calendar-whatsapp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: ADMIN_WHATSAPP_JID
        sync: false
      - key: MAIN_USER_EMAIL
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
