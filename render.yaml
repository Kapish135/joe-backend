services:
  - type: web
    name: joe-calendar-whatsapp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "false"
      - key: JOE_WORKSPACE_ID
        value: b7abfc76-5f38-4b28-a5fa-2db9b5c282ef
      - key: JOE_WORKSPACE_SLUG
        value: joe-demo
      - key: JOE_WORKSPACE_NAME
        value: Joe Demo
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: ADMIN_WHATSAPP_JID
        sync: false
      - key: MAIN_USER_EMAIL
        sync: false
      - key: PAIRING_PHONE_NUMBER
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
