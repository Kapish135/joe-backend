services:
  - type: web
    name: joe-calendar-whatsapp
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    disk:
      name: joe-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: MAKE_INGEST_SECRET
        sync: false
      - key: ADMIN_WHATSAPP_JID
        sync: false
      - key: MAIN_USER_EMAIL
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
